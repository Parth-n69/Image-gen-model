<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NeuralCanvas — AI Image Generator. Create stunning images from text prompts using FLUX.1-schnell." />
  <title>NeuralCanvas — AI Image Generator</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ─── SIDEBAR ─────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="logo.jpg" alt="NeuralCanvas" class="logo-img" />
        <span>NeuralCanvas</span>
      </div>
      <button class="new-chat-btn" id="new-chat-btn" title="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="sidebar-section-label">Suggestions</div>
    <button class="sidebar-item preset" id="preset-1" data-prompt="A vibrant sunset over a futuristic cyberpunk city skyline with neon lights reflecting on wet streets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <span>Sunset cyberpunk city</span>
    </button>
    <button class="sidebar-item preset" id="preset-2" data-prompt="A detailed portrait of an elf wizard in a dark enchanted forest, holding a glowing magical staff, cinematic lighting">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <span>Fantasy elf wizard</span>
    </button>

    <div class="sidebar-section-label">History</div>
    <div class="sidebar-history" id="sidebar-history">
      <!-- Dynamically populated from localStorage -->
    </div>

    <div class="sidebar-footer">
      <div class="credits-badge" id="credits-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="credits-remaining">Loading…</span>
      </div>
      <div class="sidebar-meta">Powered by <strong>FLUX.1-schnell</strong></div>
    </div>
  </aside>

  <!-- ─── MAIN CHAT AREA ──────────────────────────────────── -->
  <main class="chat-main" id="chat-main">

    <!-- Mobile topbar -->
    <div class="topbar">
      <button class="topbar-menu" id="toggle-sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">NeuralCanvas</span>
    </div>

    <!-- Chat messages scroll area -->
    <div class="chat-scroll" id="chat-scroll">
      <div class="chat-messages" id="chat-messages">
        <!-- Welcome message -->
        <div class="welcome-screen" id="welcome-screen">
          <div class="welcome-icon">
            <img src="logo.jpg" alt="NeuralCanvas" class="welcome-logo-img" />
          </div>
          <h2>What image would you like to create?</h2>
          <p class="welcome-sub">Type a description below or pick a suggestion from the sidebar.</p>
          <div class="welcome-chips">
            <button class="chip" data-prompt="A vibrant sunset over a futuristic cyberpunk city skyline with neon lights">🌆 Sunset cityscape</button>
            <button class="chip" data-prompt="A detailed portrait of an elf wizard in a dark enchanted forest, cinematic lighting">🧙 Fantasy wizard</button>
            <button class="chip" data-prompt="A cute robot cat sitting on a windowsill looking at rain, studio ghibli style">🐱 Robot cat</button>
            <button class="chip" data-prompt="An astronaut floating in a nebula made of flowers, surreal art">🚀 Astronaut in nebula</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Fixed bottom input bar -->
    <div class="input-bar">
      <div class="input-bar-inner">
        <textarea id="prompt-input" rows="1" placeholder="Describe the image you want to create…" maxlength="500"></textarea>
        <button id="send-btn" class="send-btn" title="Generate image" disabled>
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="input-footer">
        <span class="char-count" id="char-count">0 / 500</span>
        <span class="model-label">FLUX.1-schnell · Free tier</span>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
