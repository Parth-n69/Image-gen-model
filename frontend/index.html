<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Generate stunning AI images from text prompts using Stable Diffusion XL. Free, fast, and beautiful." />
  <title>NeuralCanvas — AI Image Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated background blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <main id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="url(#logo-grad)" />
          <path d="M9 22L16 10L23 22H9Z" fill="white" fill-opacity="0.9"/>
          <circle cx="16" cy="13" r="2.5" fill="white" fill-opacity="0.7"/>
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32">
              <stop stop-color="#a855f7"/>
              <stop offset="1" stop-color="#3b82f6"/>
            </linearGradient>
          </defs>
        </svg>
        <h1>NeuralCanvas</h1>
      </div>
      <p class="tagline">Transform words into stunning visuals with AI</p>
      <div class="credits-badge">
        <svg class="credits-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span id="credits-remaining" class="credits-ok">Loading…</span>
      </div>
    </header>

    <!-- Prompt Section -->
    <section class="prompt-section">
      <div class="input-wrapper">
        <input
          type="text"
          id="prompt-input"
          placeholder="Describe the image you want to create…"
          autocomplete="off"
          maxlength="500"
        />
        <span id="char-count" class="char-count">0 / 500</span>
      </div>
      <button id="generate-btn" type="button">
        <span class="btn-text">Generate</span>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </button>
    </section>

    <!-- Status Area -->
    <div id="status-area" class="status-area hidden">
      <div class="spinner" id="spinner"></div>
      <p id="status-text"></p>
    </div>

    <!-- Result Section -->
    <section id="result-section" class="result-section hidden">
      <div class="image-frame">
        <img id="generated-image" alt="AI generated image" />
      </div>
      <div class="result-actions">
        <button id="download-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download PNG
        </button>
        <button id="new-btn" type="button" class="secondary-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
          </svg>
          New Image
        </button>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>Powered by <strong>FLUX.1-schnell</strong> via Hugging Face · Built with Flask &amp; vanilla JS · 4 free images/day</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
